name: One-time branded social preview
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-social-preview.yml"
permissions:
  contents: write
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build social sharing image from real Mt Davis job photo
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          from pathlib import Path
          W,H=1200,630
          im=Image.new("RGB",(W,H),"#14382b")
          photo=Image.open("hvac-assets/fujitsu-mini-split.jpg").convert("RGB")
          photo=ImageOps.fit(photo,(650,630),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
          im.paste(photo,(550,0))
          d=ImageDraw.Draw(im)
          d.rectangle((0,0,554,630),fill="#12392b")
          d.rectangle((44,90,114,97),fill="#f28a2e")
          fb="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          fr="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          bold=ImageFont.truetype(fb,76)
          mid=ImageFont.truetype(fb,22)
          reg=ImageFont.truetype(fr,27)
          d.text((44,130),"MT DAVIS",font=bold,fill="#ffffff")
          d.text((44,222),"HVAC",font=bold,fill="#ffffff")
          d.text((46,340),"HEATING  •  COOLING",font=mid,fill="#cce8d9")
          d.text((46,392),"Comfort in every season.",font=reg,fill="#ffffff")
          d.text((46,505),"MEYERSDALE, PENNSYLVANIA",font=mid,fill="#c0decf")
          im.save("social-preview.jpg",quality=88,subsampling=0,optimize=True)
          assert Path("social-preview.jpg").stat().st_size > 10000
          PY
      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-preview.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add branded real-project social media preview image"
            git push
          fi