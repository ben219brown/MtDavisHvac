name: One-time gallery import dry run
on:
  push:
    branches: [main]
    paths: [".github/workflows/test-gallery-import.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build synthetic ZIP and test gallery importer without publishing
        shell: bash
        run: |
          set -eu
          python3 -m pip install --disable-pip-version-check pillow
          python3 -m py_compile scripts/import_gallery.py
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import zipfile,io,json
          slugs=["bosch-outdoor-unit","heating-piping-installation","fujitsu-ductless-installation","fujitsu-indoor-unit","heating-air-handler","boiler-and-water-heater","heating-mechanical-room","bryant-furnace","bosch-indoor-air-handler","bosch-indoor-unit","outdoor-system-install","ac-installation-in-progress","outdoor-unit-wood-house","outdoor-unit-stonewall","ductless-install-blue-house","ductless-line-connections","winter-outdoor-ductless","whole-home-ductless-overview","bryant-system-detail"]
          image=Image.open("hvac-assets/bosch-installation.jpg").convert("RGB")
          b=io.BytesIO(); image.save(b,"WEBP",quality=65); photo=b.getvalue()
          photos=[dict(slug=s,full=s+"-full.webp",thumb=s+"-thumb.webp",categories=["heating","indoor"] if i%2 else ["cooling","outdoor"],alt="Photo "+s,title="Work "+s,tag="HVAC",ratio=1.333) for i,s in enumerate(slugs)]
          Path("photo-import").mkdir(exist_ok=True)
          with zipfile.ZipFile("photo-import/mt-davis-gallery-upload.zip","w") as z:
            z.writestr("gallery-manifest.json",json.dumps(dict(photos=photos)))
            for p in photos:
              for key in ("thumb","full"):z.writestr(p[key],photo)
          PY
          python3 scripts/import_gallery.py
          python3 scripts/check_site.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html").read_text()
          assert p.count('class="gallery-photo-btn"') == 19
          assert 'bosch-outdoor-unit-full.webp' in p
          assert 'heating-piping-installation-full.webp' in p
          print("PASS: 19 accessible photo buttons, new hero/About, generated service images and sitemap")
          PY