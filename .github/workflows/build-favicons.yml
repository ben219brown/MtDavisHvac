name: One-time browser icon generation
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-favicons.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate browser favicons from approved Mt Davis mountain icon
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import io, base64
          src=Image.open(io.BytesIO(base64.b64decode(""))).convert("RGBA")
          src.save("favicon-source.png", optimize=True)
          src.resize((32,32),Image.Resampling.LANCZOS).save("favicon-32.png", optimize=True)
          src.resize((192,192),Image.Resampling.LANCZOS).save("favicon-192.png", optimize=True)
          apple=Image.new("RGBA",(180,180),(255,255,255,255))
          apple.alpha_composite(src.resize((166,166),Image.Resampling.LANCZOS),(7,7))
          apple.convert("RGB").save("apple-touch-icon.png", optimize=True)
          src.save("favicon.ico",format="ICO",sizes=[(16,16),(32,32),(48,48)])
          for path in ["favicon-32.png","favicon-192.png","apple-touch-icon.png","favicon.ico"]:
            assert Path(path).stat().st_size > 0
          PY
      - name: Commit generated image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon-source.png favicon-32.png favicon-192.png apple-touch-icon.png favicon.ico
          if ! git diff --cached --quiet; then
            git commit -m "Add approved Mt Davis icon in PNG, ICO and Apple formats"
            git push
          fi