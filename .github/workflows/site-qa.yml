name: Verify Site SEO and Assets
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SEO, sitemap, form, favicon and local asset paths
        run: python3 scripts/check_site.py
