name: One-time HVAC asset import

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the existing Mt Davis assets from the JobSnapApp demo repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hvac-assets
          base="https://raw.githubusercontent.com/ben219brown/JobSnapAppSite/main/hvac-assets"
          for asset in fujitsu-mini-split.jpg bosch-installation.jpg bryant-furnace.jpg bosch-logo.svg fujitsu-logo.svg; do
            curl --fail --location --retry 3 --silent --show-error "$base/$asset" -o "hvac-assets/$asset"
            test -s "hvac-assets/$asset"
            file "hvac-assets/$asset"
          done
          for image in fujitsu-mini-split.jpg bosch-installation.jpg bryant-furnace.jpg; do
            test "$(file --mime-type --brief "hvac-assets/$image")" = "image/jpeg"
          done
          for logo in bosch-logo.svg fujitsu-logo.svg; do
            grep -q '<svg' "hvac-assets/$logo"
          done

      - name: Commit the site's locally hosted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hvac-assets/
          if git diff --cached --quiet; then
            echo "Assets unchanged"
          else
            git commit -m "Import original Mt Davis HVAC assets into dedicated site"
            git push
          fi